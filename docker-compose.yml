services:
  db:
    image: postgres
    container_name: pixorydb
    environment:
      - POSTGRES_PASSWORD=mypixorydatabase
    volumes:
      - pixorydbvolume:/var/lib/postgresql/data
  app:
    build:
      context: ./
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pixorydbvolume:
